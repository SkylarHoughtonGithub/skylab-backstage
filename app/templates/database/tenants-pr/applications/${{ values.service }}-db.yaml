apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: ${{ values.service }}-db
  namespace: ${{ values.service }}
  labels:
    skylab.io/system: ${{ values.service }}
spec:
  components:
    - name: postgres
      # Postgres provisioning rides on the built-in k8s-objects component
      # instead of a dedicated `postgres` ComponentDefinition — one less
      # cross-repo dependency for the MVP. The password Secret below is
      # dev-only; replace with an ESO ExternalSecret before production use.
      type: k8s-objects
      properties:
        objects:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: ${{ values.service }}-db-password
            type: Opaque
            stringData:
              password: changeme-dev-only
          - apiVersion: database.skylab.io/v1alpha1
            kind: XPostgres
            metadata:
              name: ${{ values.service }}
            spec:
              cloud: ${{ values.cloud }}
              region: ${{ values.region }}
              version: '${{ values.version }}'
              storageGB: ${{ values.storageGB }}
              databaseName: ${{ values.databaseName }}
              username: ${{ values.username }}
              passwordSecretRef:
                name: ${{ values.service }}-db-password
                namespace: ${{ values.service }}
                key: password
              {%- if values.cloud == 'aws' %}
              aws:
                dbSubnetGroupName: ${{ values.awsDbSubnetGroupName }}
                vpcSecurityGroupIds:
                  {%- for sg in values.awsVpcSecurityGroupIds %}
                  - ${{ sg }}
                  {%- endfor %}
              {%- endif %}
              {%- if values.cloud == 'gcp' %}
              gcp:
                network: ${{ values.gcpNetwork }}
              {%- endif %}
