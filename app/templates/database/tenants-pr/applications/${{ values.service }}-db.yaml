apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: ${{ values.service }}-db
  namespace: ${{ values.service }}
  labels:
    skylab.io/system: ${{ values.service }}
spec:
  components:
    - name: db
      # Skylab `postgres` ComponentDefinition (skylab-gitops/charts/kubevela-defs).
      # Emits the XPostgres XR + a compose Job that derives DATABASE_URL
      # into the `db-url` Secret (named after this component). The service's
      # Application envFrom's `db-url` to pick up the URL in-namespace.
      #
      # Dev-only hardcoded password until ESO-backed Secrets land.
      type: postgres
      properties:
        cloud: ${{ values.cloud }}
        region: ${{ values.region }}
        version: '${{ values.version }}'
        storageGB: ${{ values.storageGB }}
        databaseName: ${{ values.databaseName }}
        username: ${{ values.username }}
        password: changeme-dev-only
        {%- if values.cloud == 'aws' %}
        aws:
          dbSubnetGroupName: ${{ values.awsDbSubnetGroupName }}
          vpcSecurityGroupIds:
            {%- for sg in values.awsVpcSecurityGroupIds %}
            - ${{ sg }}
            {%- endfor %}
        {%- endif %}
        {%- if values.cloud == 'gcp' %}
        gcp:
          network: ${{ values.gcpNetwork }}
        {%- endif %}
