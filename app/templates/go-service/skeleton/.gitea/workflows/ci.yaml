name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ '${{ github.actor }}' }}
          password: ${{ '${{ secrets.GITHUB_TOKEN }}' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/platform/${{ values.name }}:${{ '${{ github.sha }}' }}
          sbom: true
          provenance: mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/platform/${{ values.name }}:${{ '${{ github.sha }}' }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "ghcr.io/platform/${{ values.name }}@${{ '${{ steps.build.outputs.digest }}' }}"
