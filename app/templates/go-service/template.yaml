apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: go-service
  title: Go service
  description: |
    Create a new Go service with OpenTelemetry, TechDocs, Gitea Actions CI,
    a catalog entry, and a KubeVela Application opened as a PR against
    platform/tenants.
  tags: [recommended, go, kubevela]
spec:
  owner: platform
  type: service
  parameters:
    - title: Service identity
      required: [name, description]
      properties:
        name:
          title: Name
          type: string
          description: Lowercase, kebab-case. Used as repo name, image name, k8s ns.
          pattern: '^[a-z][a-z0-9-]*$'
          maxLength: 32
        description:
          title: Description
          type: string
          description: One-line description of what the service does.
    - title: Owner & lifecycle
      required: [owner]
      properties:
        owner:
          title: Owner
          type: string
          description: Group or User that owns the service.
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group, User]
        lifecycle:
          title: Lifecycle
          type: string
          enum: [experimental, production, deprecated]
          default: experimental
    - title: Delivery
      required: [giteaHost]
      properties:
        giteaHost:
          title: Gitea host
          type: string
          description: Gitea host where the new repo and the tenants PR land.
          default: gitea.skylab.local
  steps:
    - id: fetch-skeleton
      name: Fetch Go service skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          lifecycle: ${{ parameters.lifecycle }}

    - id: publish
      name: Publish repo on Gitea
      action: publish:gitea
      input:
        repoUrl: ${{ parameters.giteaHost }}?owner=platform&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main

    - id: register
      name: Register in Backstage catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: fetch-tenants
      name: Render KubeVela Application for platform/tenants
      action: fetch:template
      input:
        url: ./tenants-pr
        targetPath: tenants-pr
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}

    - id: tenants-pr
      name: Open platform/tenants PR
      action: gitea:pull-request
      input:
        repoUrl: ${{ parameters.giteaHost }}?owner=platform&repo=tenants
        branchName: add-${{ parameters.name }}
        title: 'add KubeVela Application: ${{ parameters.name }}'
        description: |
          Adds a KubeVela Application for `${{ parameters.name }}` so Argo CD
          can sync it. Generated by the go-service golden-path template.

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Entity
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: platform/tenants PR
        url: ${{ steps.tenants-pr.output.pullRequestUrl }}
