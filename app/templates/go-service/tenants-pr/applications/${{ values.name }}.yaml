apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.name }}
  labels:
    skylab.io/system: ${{ values.name }}
spec:
  components:
    - name: web
      # Skylab `go-service` ComponentDefinition (charts/kubevela-defs in
      # skylab-gitops). Bakes in OTel env to in-cluster Alloy,
      # skylab.io/system labels, and /healthz probes — so this manifest
      # only needs the image.
      type: go-service
      properties:
        image: ghcr.io/platform/${{ values.name }}:latest
